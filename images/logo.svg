<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" rx="80" fill="#0A0A0A"/>
  <!-- shadow layers -->
  <g opacity="0.9">
    <!-- bottom layer - anti-ai-slop (red) -->
    <rect x="90" y="140" width="220" height="140" rx="16" fill="#FF3D00" stroke="#0A0A0A" stroke-width="3" transform="rotate(-3 200 200)"/>
    <!-- middle layer - design-template (violet) -->
    <rect x="80" y="120" width="220" height="140" rx="16" fill="#7C3AED" stroke="#0A0A0A" stroke-width="3" transform="rotate(2 200 200)"/>
    <!-- top layer - brief-ku (blue) document -->
    <rect x="70" y="100" width="220" height="140" rx="16" fill="#0052FF" stroke="#0A0A0A" stroke-width="3"/>
    <!-- document lines -->
    <rect x="90" y="120" width="80" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="90" y="140" width="140" height="6" rx="3" fill="white" opacity="0.6"/>
    <rect x="90" y="155" width="120" height="6" rx="3" fill="white" opacity="0.6"/>
    <rect x="90" y="170" width="100" height="6" rx="3" fill="white" opacity="0.6"/>
    <!-- check badge -->
    <circle cx="260" cy="190" r="32" fill="#0A0A0A" stroke="white" stroke-width="3"/>
    <path d="M245 190 L255 200 L275 180" stroke="#00FF88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- title -->
  <text x="200" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="42" font-weight="900" fill="white" letter-spacing="-1">PRD KIT</text>
  <text x="200" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#A1A1AA" letter-spacing="3">BRIEF × FILTER × DESIGN</text>
  <!-- dots -->
  <circle cx="140" cy="340" r="6" fill="#0052FF"/>
  <circle cx="200" cy="340" r="6" fill="#FF3D00"/>
  <circle cx="260" cy="340" r="6" fill="#7C3AED"/>
</svg>
