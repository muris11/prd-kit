name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON manifests
        run: |
          node -e "['package.json','plugin.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json'].forEach(f=>{JSON.parse(require('fs').readFileSync(f,'utf8'));console.log('ok',f)})"

      - name: Validate every skill has name + description frontmatter
        run: npm run sync-skills

      - name: Run the smoke test
        run: npm test
